# Keys that no rendered object depends on and that are still read: by the
# workflows on the hub, or by the chart in a way a single value change does not
# show (tools/unused-keys/audit.py). One entry per finding:
#   <category>:
#     <key>: {reason: <who reads it and why>, readBy: <file that must mention the key>}
# readBy is relative to tpg-fleet (chart, fleet, inputs) or tpg-aks-infra
# (terraform, inventory). An entry that is no longer a finding fails the lint.
chart:
  cluster.maxReadReplicas:
    reason: the cap tpg-day0, tpg-create-instance and tpg-scale-instance apply to readReplicas; read on the hub, not rendered
    readBy: workflows/scripts/discover.sh
  cluster.name:
    reason: set by the tpg-instances ApplicationSet; selects the instance's entry of clusters/fleet.yaml when the chart reads the current patch files
    readBy: charts/tpg-instance/templates/_helpers.tpl
  valuesOverride:
    reason: merged over the values after the patch files (tpg.ctx); written by tpg-restore; its keys are chart values
    readBy: charts/tpg-instance/templates/_helpers.tpl
fleet:
  instance.patches.postgres.current:
    reason: the current postgres patch file; read by the chart through the clusters value (tpg.kindPatch) and by the workflows
    readBy: charts/tpg-instance/templates/_helpers.tpl
  instance.patches.postgresValues.current:
    reason: the current values patch file; read by the chart (tpg.ctx) and by the workflows
    readBy: charts/tpg-instance/templates/_helpers.tpl
  instance.patches.postgresValues.previous.path:
    reason: a record of the file before the current one (tpg-patch revert and audit); read by the workflows only
    readBy: workflows/scripts/lib.sh
  instance.patches.postgresValues.previous.commit:
    reason: the commit that added the previous file; read by the workflows only
    readBy: workflows/scripts/lib.sh
  cluster.operator.version:
    reason: the operator chart version; read by the tpg-operator ApplicationSet and the workflows
    readBy: bootstrap/appsets/tpg-operator.yaml
  cluster.operator.patches.values.current:
    reason: the current operator values file; copied to patches/operator/clusters/<cluster>.yaml, which the tpg-operator ApplicationSet passes
    readBy: workflows/scripts/lib.sh
