# The ServiceAccount tpg-credential-writer writes fleet secrets to Vault (Round 15,
# design decision D87): only the write step of the WorkflowTemplate
# tpg-rotate-credential may run as it. In the argo namespace (and for every
# ClusterWorkflowTemplate) this policy refuses:
#   - an object that names tpg-credential-writer: spec.serviceAccountName,
#     spec.executor.serviceAccountName, the serviceAccountName or executor of
#     templateDefaults, of a template, or of an inline template of a step or DAG
#     task; the WorkflowTemplate tpg-rotate-credential itself is the one exception;
#   - a podSpecPatch (spec, templateDefaults, template, inline template) that
#     mentions a ServiceAccount in any letter case, or holds a backslash or "!!",
#     because a JSON or YAML escape or tag could spell the name another way;
#   - an inline template that nests steps or a DAG (they would escape the checks above);
#   - a templateRef to tpg-rotate-credential, in a step, a DAG task or a lifecycle
#     hook, from anything but tpg-rotate-credential itself: its write step would run
#     as the writer inside a Workflow of someone else's making;
#   - a Workflow or CronWorkflow that runs tpg-rotate-credential (workflowTemplateRef)
#     with anything but ['workflowTemplateRef', 'arguments', 'shutdown', 'suspend', 'activeDeadlineSeconds', 'priority'] in its spec:
#     podSpecPatch, templateDefaults, volumes, entrypoint and the like would reach
#     the write step, whose Workflow spec takes precedence over the template's;
#   - a change of the WorkflowTemplate tpg-rotate-credential by anyone but Argo CD
#     (the tpg-hub-workflows Application syncs it from Git; a ServiceAccount of the
#     argocd namespace);
#   - a ConfigMap written by the ServiceAccounts tpg-workflow or tpg-credential-writer
#     (they share one Role) other than a run record tpg-run-*: the write step runs
#     /scripts/rotate-write.sh from tpg-scripts and reads the registry host and the
#     fleet repository URL from tpg-settings, so a workflow step that rewrote either
#     could run code as the writer or send a new credential elsewhere. tpg-scripts
#     and tpg-vault-agent come from Argo CD, tpg-settings from tpg-aks-infra;
#   - a change of a pod's spec by those two ServiceAccounts (the executor may change
#     pod metadata; a new image of a running write step would run as the writer).
# The write step's image and script ConfigMap are fixed in the WorkflowTemplate, not
# parameters. Pods in the argo namespace are created by the Argo Workflows
# controller; keep the right to create pods there to the controller and the hub
# administrators. Tested in tpg-fleet tests/admission. Kubernetes 1.30 or later.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tpg-credential-writer
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argo
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workflows", "workflowtemplates", "cronworkflows", "clusterworkflowtemplates"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods"]
  variables:
    - name: spec
      expression: >-
        request.resource.group != 'argoproj.io' ? {} : object.kind == 'CronWorkflow' ? (has(object.spec.workflowSpec) ? object.spec.workflowSpec : {}) : (has(object.spec) ? object.spec : {})
    - name: w
      expression: "'tpg-credential-writer'"
    - name: rot
      expression: "'tpg-rotate-credential'"
    - name: templates
      expression: "has(variables.spec.templates) ? variables.spec.templates : []"
    - name: names
      expression: >-
        (has(variables.spec.serviceAccountName) && variables.spec.serviceAccountName == variables.w) || (has(variables.spec.executor) && has(variables.spec.executor.serviceAccountName) && variables.spec.executor.serviceAccountName == variables.w) || (has(variables.spec.templateDefaults) && ((has(variables.spec.templateDefaults.serviceAccountName) && variables.spec.templateDefaults.serviceAccountName == variables.w) || (has(variables.spec.templateDefaults.executor) && has(variables.spec.templateDefaults.executor.serviceAccountName) && variables.spec.templateDefaults.executor.serviceAccountName == variables.w))) || variables.templates.exists(t, ((has(t.serviceAccountName) && t.serviceAccountName == variables.w) || (has(t.executor) && has(t.executor.serviceAccountName) && t.executor.serviceAccountName == variables.w)) || (has(t.steps) && t.steps.exists(g, g.exists(s, has(s.inline) && ((has(s.inline.serviceAccountName) && s.inline.serviceAccountName == variables.w) || (has(s.inline.executor) && has(s.inline.executor.serviceAccountName) && s.inline.executor.serviceAccountName == variables.w))))) || (has(t.dag) && has(t.dag.tasks) && t.dag.tasks.exists(k, has(k.inline) && ((has(k.inline.serviceAccountName) && k.inline.serviceAccountName == variables.w) || (has(k.inline.executor) && has(k.inline.executor.serviceAccountName) && k.inline.executor.serviceAccountName == variables.w)))))
    - name: patchBad
      expression: >-
        (has(variables.spec.podSpecPatch) && (string(variables.spec.podSpecPatch).lowerAscii().contains('serviceaccount') || string(variables.spec.podSpecPatch).contains('\\') || string(variables.spec.podSpecPatch).contains('!!'))) || (has(variables.spec.templateDefaults) && (has(variables.spec.templateDefaults.podSpecPatch) && (string(variables.spec.templateDefaults.podSpecPatch).lowerAscii().contains('serviceaccount') || string(variables.spec.templateDefaults.podSpecPatch).contains('\\') || string(variables.spec.templateDefaults.podSpecPatch).contains('!!')))) || variables.templates.exists(t, ((has(t.podSpecPatch) && (string(t.podSpecPatch).lowerAscii().contains('serviceaccount') || string(t.podSpecPatch).contains('\\') || string(t.podSpecPatch).contains('!!')))) || (has(t.steps) && t.steps.exists(g, g.exists(s, has(s.inline) && ((has(s.inline.podSpecPatch) && (string(s.inline.podSpecPatch).lowerAscii().contains('serviceaccount') || string(s.inline.podSpecPatch).contains('\\') || string(s.inline.podSpecPatch).contains('!!'))))))) || (has(t.dag) && has(t.dag.tasks) && t.dag.tasks.exists(k, has(k.inline) && ((has(k.inline.podSpecPatch) && (string(k.inline.podSpecPatch).lowerAscii().contains('serviceaccount') || string(k.inline.podSpecPatch).contains('\\') || string(k.inline.podSpecPatch).contains('!!')))))))
    - name: nestedInline
      expression: >-
        variables.templates.exists(t, (has(t.steps) && t.steps.exists(g, g.exists(s, has(s.inline) && (has(s.inline.steps) || has(s.inline.dag))))) || (has(t.dag) && has(t.dag.tasks) && t.dag.tasks.exists(k, has(k.inline) && (has(k.inline.steps) || has(k.inline.dag)))))
    - name: refsRotate
      expression: >-
        (has(variables.spec.hooks) && variables.spec.hooks.exists(h, (has(variables.spec.hooks[h].templateRef) && has(variables.spec.hooks[h].templateRef.name) && variables.spec.hooks[h].templateRef.name == variables.rot))) || variables.templates.exists(t, (has(t.steps) && t.steps.exists(g, g.exists(s, (has(s.templateRef) && has(s.templateRef.name) && s.templateRef.name == variables.rot) || (has(s.hooks) && s.hooks.exists(h, (has(s.hooks[h].templateRef) && has(s.hooks[h].templateRef.name) && s.hooks[h].templateRef.name == variables.rot)))))) || (has(t.dag) && has(t.dag.tasks) && t.dag.tasks.exists(k, (has(k.templateRef) && has(k.templateRef.name) && k.templateRef.name == variables.rot) || (has(k.hooks) && k.hooks.exists(h, (has(k.hooks[h].templateRef) && has(k.hooks[h].templateRef.name) && k.hooks[h].templateRef.name == variables.rot))))))
    - name: isRotateTemplate
      expression: object.kind == 'WorkflowTemplate' && object.metadata.name == 'tpg-rotate-credential'
    - name: runsRotate
      expression: >-
        (object.kind == 'Workflow' || object.kind == 'CronWorkflow') && has(variables.spec.workflowTemplateRef) && has(variables.spec.workflowTemplateRef.name) && variables.spec.workflowTemplateRef.name == variables.rot
    - name: extraKeys
      expression: >-
        variables.runsRotate ? variables.spec.filter(k, !(k in ['workflowTemplateRef', 'arguments', 'shutdown', 'suspend', 'activeDeadlineSeconds', 'priority'])) : []
    - name: byArgoCD
      expression: request.userInfo.username.startsWith('system:serviceaccount:argocd:')
    - name: byWorkflowSA
      expression: >-
        request.userInfo.username in ['system:serviceaccount:argo:tpg-workflow', 'system:serviceaccount:argo:' + variables.w]
  validations:
    - expression: "!variables.names || variables.isRotateTemplate"
      messageExpression: >-
        object.kind + ' ' + object.metadata.name + ': only the WorkflowTemplate tpg-rotate-credential may run as the ServiceAccount tpg-credential-writer'
      reason: Forbidden
    - expression: "!variables.patchBad"
      messageExpression: >-
        object.kind + ' ' + object.metadata.name + ': a podSpecPatch may not set a ServiceAccount, and may not hold a backslash or !! (an escape or tag could hide one)'
      reason: Forbidden
    - expression: "!variables.nestedInline"
      messageExpression: >-
        object.kind + ' ' + object.metadata.name + ': an inline template may not nest steps or a DAG'
      reason: Forbidden
    - expression: "!variables.refsRotate || variables.isRotateTemplate"
      messageExpression: >-
        object.kind + ' ' + object.metadata.name + ': only tpg-rotate-credential itself may reference its templates (templateRef tpg-rotate-credential); submit a Workflow from it instead'
      reason: Forbidden
    - expression: "size(variables.extraKeys) == 0"
      messageExpression: >-
        object.kind + ' ' + object.metadata.name + ': a run of tpg-rotate-credential takes only workflowTemplateRef and arguments; remove ' + variables.extraKeys.join(', ')
      reason: Forbidden
    - expression: "!variables.isRotateTemplate || variables.byArgoCD"
      message: "the WorkflowTemplate tpg-rotate-credential is written by Argo CD only (Application tpg-hub-workflows, from Git)"
      reason: Forbidden
    - expression: "request.resource.resource != 'configmaps' || !variables.byWorkflowSA || object.metadata.name.startsWith('tpg-run-')"
      messageExpression: >-
        'ConfigMap ' + object.metadata.name + ': the workflow ServiceAccounts write only run records (tpg-run-*); tpg-scripts and tpg-vault-agent come from Argo CD, tpg-settings from tpg-aks-infra'
      reason: Forbidden
    - expression: "request.resource.resource != 'pods' || !variables.byWorkflowSA || object.spec == oldObject.spec"
      messageExpression: >-
        'Pod ' + object.metadata.name + ': the workflow ServiceAccounts may change pod metadata only, not the spec (image, containers)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tpg-credential-writer
spec:
  policyName: tpg-credential-writer
  validationActions: ["Deny"]
