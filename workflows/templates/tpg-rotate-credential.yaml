# Day 1: create or rotate a secret in Vault and verify it everywhere it is used
# (Round 15, design decision D87). The new value never travels as a workflow
# input: tpg-aks-infra scripts/vault-secret.sh wrap wraps it in Vault
# (sys/wrapping/wrap: single use, 10 minutes) and prints a wrapping token, the
# input wrappingToken; the write step unwraps it once, checks the value (the
# registry login, the GitHub token, the storage key, the PEM bundle) and writes it
# with its own ServiceAccount tpg-credential-writer (Vault role and policy
# tpg-credential-writer; the admission policy tpg-credential-writer keeps that
# ServiceAccount to this WorkflowTemplate). A CA bundle is public: it may also come
# as a PEM file of the submitting machine (caBundleFile, contents in patchFiles).
# Without wrappingToken or caBundleFile the value was written by hand and the run
# only verifies it. The Vault Secrets Operator and Vault Agent distribute the value;
# the verify steps wait for them.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-rotate-credential
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: create or rotate a secret in Vault from a single-use wrapping token (or a CA bundle
      file), check it, write it with the ServiceAccount tpg-credential-writer, and verify it
      everywhere it is used (the Vault Secrets Operator and Vault Agent distribute it).
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 20
  arguments:
    parameters:
    - name: secretType
      description: >-
        broadcom-registry (Argo CD Helm repository, regsecret on every target, image pull test),
        backup-storage (backup-storage on every target, backup locations, container access),
        git-push (workflow clone and push), git-read (Argo CD fleet repository),
        monitoring-remote-write (standalone monitoring gateway credential), ca-bundle
        (tpg/ca-bundles/<secretName>, key caBundle) or custom (tpg/custom/<secretName>, any keys)
      value: "broadcom-registry"
      enum: ["broadcom-registry", "backup-storage", "git-push", "git-read", "monitoring-remote-write", "ca-bundle", "custom"]
    - name: secretName
      description: "ca-bundle and custom: the secret name under tpg/ca-bundles/ or tpg/custom/ (a Kubernetes object name)"
      value: ""
    - name: wrappingToken
      description: "The single-use Vault wrapping token that holds the new value (tpg-aks-infra scripts/vault-secret.sh wrap <secretType> prints it; 10 minutes). Empty: the value is already in Vault and the run only verifies it"
      value: ""
    - name: caBundleFile
      description: "ca-bundle only, instead of wrappingToken: a PEM file of the submitting machine (.pem, .crt, .cer; contents in patchFiles); not a repo: file"
      value: ""
    - name: patchFiles
      description: "JSON map: the contents of caBundleFile, {\"<path>\": \"<base64>\"}; scripts/submit/pack-patch-files.sh -o FILE writes it"
      value: ""
    - name: clusters
      value: "all"
    - name: maxParallel
      value: "5"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: write
        template: write-secret
        when: "'{{workflow.parameters.wrappingToken}}' != '' || '{{workflow.parameters.caBundleFile}}' != ''"
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        when: "'{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage'"
        arguments:
          parameters:
            - name: clusters
              value: "{{workflow.parameters.clusters}}"
    - - name: hub
        template: rotate-hub
    - - name: plan
        templateRef:
          name: tpg-lib
          template: plan-batches
        when: "'{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage'"
        arguments:
          parameters:
            - name: requirePrecheck
              value: "false"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
    - - name: rotate
        template: run-batches
        when: "('{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage') && {{steps.plan.outputs.parameters.hasBatches}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.plan.outputs.parameters.batches}}"
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: batch
        template: rotate-cluster
        arguments:
          parameters:
            - name: cluster
              value: "{{item}}"
        withParam: "{{steps.split.outputs.parameters.first}}"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  - name: validate
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, rotate]
      env: &rotate-env
        - {name: P_SECRET_TYPE, value: "{{workflow.parameters.secretType}}"}
        - {name: P_SECRET_NAME, value: "{{workflow.parameters.secretName}}"}
        - {name: P_CLUSTERS, value: "{{workflow.parameters.clusters}}"}
        - {name: P_MAX_PARALLEL, value: "{{workflow.parameters.maxParallel}}"}
        - {name: P_CA_FILE, value: "{{workflow.parameters.caBundleFile}}"}
        # wrappingToken and patchFiles are read from the Workflow object (lib.sh)
        - {name: P_WORKFLOW, value: "{{workflow.name}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  # The only step that writes to Vault: ServiceAccount tpg-credential-writer (Vault
  # role tpg-credential-writer), no Vault Agent (it logs in itself after the unwrap)
  - name: write-secret
    serviceAccountName: tpg-credential-writer
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    container:
      # Fixed, not the toolsImage parameter: a run could otherwise choose the image
      # that runs as the writer. The script comes from the fixed ConfigMap tpg-scripts
      # (spec.volumes), and the admission policy tpg-credential-writer refuses a run
      # that brings volumes or a podSpecPatch of its own. Keep it equal to the default
      # of toolsImage.
      image: alpine/k8s:1.35.8
      command: [bash, /scripts/rotate-write.sh]
      args:
        - "{{workflow.name}}"
      env: *rotate-env
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: rotate-hub
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-hub.sh]
      args:
        - "{{workflow.name}}"
        - "{{workflow.parameters.secretType}}"
      env:
        - {name: P_SECRET_NAME, value: "{{workflow.parameters.secretName}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: rotate-cluster
    inputs:
      parameters:
        - name: cluster
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_rotation_result
          help: "Credential rotation result per cluster"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: secret_type
              value: "{{workflow.parameters.secretType}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-cluster.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{workflow.parameters.secretType}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: cluster
