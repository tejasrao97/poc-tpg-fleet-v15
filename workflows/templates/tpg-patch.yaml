# Day 1: patch Tanzu Postgres instances and operators that are already deployed
# (Round 14, design decisions D76 to D79; Round 15, D81 to D83). The patch files
# come from the machine that submits the run (absolute or relative paths; the
# path inputs name them and patchFiles carries their contents:
# scripts/submit/tpg-patch.sh fills it; for a plain argo submit,
# scripts/submit/pack-patch-files.sh -o PARAMETER_FILE packs every local path of
# the parameter file) or from the fleet repository (repo:<path>). The validate step checks each file
# against the input it was passed to; the plan step checks every cluster, renders
# the targets with helm, sends them through the API server (--dry-run=server) and
# prints the diff. Then, per cluster (canary first, then batches of maxParallel):
# one commit (pushMode=pr: a pull request branch, synced before the merge and merged
# by a person; pushMode=direct: the fleet branch), the sync, the checks, and a
# revert when anything fails.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-patch
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: patch deployed Postgres instances (partial manifests of Postgres, PostgresBackupLocation,
      PostgresBackupSchedule and PostgresFerretDocumentDB, or chart values) and operators (chart
      values of an allow-list) with files from the submitting machine or the fleet repository.
      Checks each file, renders and dry-runs every target, prints the diff, then per cluster
      commits (pushMode=pr: pull request branch, synced before a person merges it), syncs,
      verifies and reverts on failure.
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 20
  arguments:
    parameters:
    # ---- targets: clusterMap, or clusters (and instances)
    - name: clusterMap
      description: "Map (YAML or JSON): cluster -> {operatorValuesPatchFilePath, patchMode, clearKinds, instances: {instance -> {postgresPatchFilePath (a list), postgresValuesPatchFilePath, patchMode, clearKinds}}}; each path a local file whose contents patchFiles carries, or repo:<path>. Schema: workflows/params/schemas/clustermap-patch.schema.json. Example: {aks-tpg-poc-01: {operatorValuesPatchFilePath: ./operator-resources.yaml, instances: {orders-db: {postgresPatchFilePath: [./orders-memory.yaml, ./orders-backup-location.yaml], postgresValuesPatchFilePath: ./orders-backup.yaml}}}}"
      value: ""
    - name: clusters
      description: "List: comma-separated registered clusters, or all (without clusterMap)"
      value: ""
    - name: instances
      description: "List: comma-separated instances, or all (without clusterMap; needed for instance patch files)"
      value: ""
    # ---- patch files (defaults of every target; clusterMap keys override them)
    - name: postgresPatchFilePath
      description: "List (comma-separated) of .yaml or .yml files: partial manifests, one document per kind (Postgres, PostgresBackupLocation, PostgresBackupSchedule with metadata.name <instance>-backup-full or -incremental, PostgresFerretDocumentDB; apiVersion, kind, spec), each a local file (absolute or relative; contents in patchFiles) or repo:charts/tpg-instance/patches/<file>. Combined with the kinds the instance's current postgres file carries into charts/tpg-instance/patches/<instance>-postgres-<hash>.yaml, its new current file"
      value: ""
    - name: postgresValuesPatchFilePath
      description: "One .yaml or .yml file (local, absolute or relative, or repo:charts/tpg-instance/patches/<file>): tpg-instance chart values; stored as charts/tpg-instance/patches/<name>-<uid>.yaml and made the current postgresValues patch of each instance"
      value: ""
    - name: operatorValuesPatchFilePath
      description: "One .yaml or .yml file (local, absolute or relative, or repo:patches/operator/<file>): operator chart values, only operatorImage (same tag as the cluster's operator version), instanceRegistryRepo, ferretDBImageRepo, dockerRegistrySecretName, certManagerClusterIssuerName, certManagerNamespace, resources (limits, requests: cpu, memory), enableSecurityContext; stored as patches/operator/<name>-<uid>.yaml"
      value: ""
    - name: patchFiles
      description: "JSON map: the contents of the local patch files, {\"<path as given above>\": \"<base64>\"}; filled by scripts/submit/tpg-patch.sh, or written into a parameter file by scripts/submit/pack-patch-files.sh -o FILE. Empty with patchMode=clear and for repo: files"
      value: ""
    - name: backupCaBundleFile
      description: "One PEM file (.pem, .crt, .cer; local, absolute or relative, or repo:ca-bundles/<file>): the new CA bundle of the backup location of every selected instance with enableSSL true (contents in patchFiles); a map key of the instance or its cluster wins. Changing the backup location restarts the instance"
      value: ""
    - name: backupCaBundleVaultSecret
      description: "The name of a CA bundle in Vault (tpg/ca-bundles/<name>, key caBundle; tpg-aks-infra scripts/vault-secret.sh ca put writes it): the new CA bundle of every selected enableSSL instance. Not with backupCaBundleFile"
      value: ""
    - name: patchMode
      description: "apply: the files become the current patches (the former current is recorded as previous); clear: the kinds named by clearKinds lose their current file (recorded as previous)"
      value: apply
      enum: ["apply", "clear"]
    - name: clearKinds
      description: "patchMode=clear: the kinds whose current patch is removed, comma-separated: Postgres, PostgresBackupLocation, PostgresBackupSchedule, PostgresFerretDocumentDB (documents of the postgres file), postgresValues, operatorValues, or all"
      value: ""
    # ---- mandatory
    - name: pushMode
      description: "pr: per cluster a branch and pull request, synced before the merge; the workflow waits for a person to merge it (closed or not merged within prTimeoutSeconds: the cluster is synced back and the branch deleted). direct: per cluster a commit on the fleet branch (reverted by a revert commit when the sync or the checks fail)"
      value: ""
      enum: ["", "direct", "pr"]
    # ---- optional
    - name: maxParallel
      value: "1"
    - name: rolloutMode
      description: "canary: one wave-0 cluster first, then batches of maxParallel; batches: no canary, batches of maxParallel; all: every selected cluster at once"
      value: canary
      enum: ["canary", "batches", "all"]
    - name: dryRun
      description: "true: check the files, render and dry-run every target and print the diff; commit and sync nothing"
      value: "false"
      enum: ["false", "true"]
    - name: timeoutSeconds
      description: "Per operator and per instance"
      value: "1800"
    - name: prTimeoutSeconds
      description: "pushMode=pr: how long to wait for the merge of each cluster's pull request before the cluster is synced back"
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        arguments:
          parameters:
            - name: clusters
              value: "{{steps.validate.outputs.parameters.selection}}"
            - name: filter
              value: pairs
            - name: instances
              value: "{{workflow.parameters.instances}}"
            - name: clusterMap
              value: "{{workflow.parameters.clusterMap}}"
    - - name: plan-patch
        template: plan-patch
    - - name: plan
        templateRef:
          name: tpg-lib
          template: plan-batches
        arguments:
          parameters:
            - name: requirePrecheck
              value: "true"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
            - name: rolloutMode
              value: "{{workflow.parameters.rolloutMode}}"
    - - name: patch
        template: run-batches
        when: "{{workflow.parameters.dryRun}} == false && {{steps.plan.outputs.parameters.hasBatches}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.plan.outputs.parameters.batches}}"
  - name: validate
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    outputs:
      parameters:
        - name: selection
          valueFrom:
            path: /tmp/selection
            default: ""
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, patch]
      env: &patch-env
        - {name: P_CLUSTER_MAP, value: "{{workflow.parameters.clusterMap}}"}
        - {name: P_CLUSTERS, value: "{{workflow.parameters.clusters}}"}
        - {name: P_INSTANCES, value: "{{workflow.parameters.instances}}"}
        - {name: P_POSTGRES_PATCH, value: "{{workflow.parameters.postgresPatchFilePath}}"}
        - {name: P_VALUES_PATCH, value: "{{workflow.parameters.postgresValuesPatchFilePath}}"}
        - {name: P_OPERATOR_VALUES_PATCH, value: "{{workflow.parameters.operatorValuesPatchFilePath}}"}
        # patchFiles is read from the Workflow object (lib.sh patch_files_json): it
        # may be larger than one environment variable can be
        - {name: P_WORKFLOW, value: "{{workflow.name}}"}
        - {name: P_PATCH_MODE, value: "{{workflow.parameters.patchMode}}"}
        - {name: P_CLEAR_KINDS, value: "{{workflow.parameters.clearKinds}}"}
        - {name: P_BACKUP_CA_FILE, value: "{{workflow.parameters.backupCaBundleFile}}"}
        - {name: P_BACKUP_CA_VAULT, value: "{{workflow.parameters.backupCaBundleVaultSecret}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_MAX_PARALLEL, value: "{{workflow.parameters.maxParallel}}"}
        - {name: P_ROLLOUT_MODE, value: "{{workflow.parameters.rolloutMode}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.timeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: plan-patch
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/patch-plan.sh]
      args:
        - "{{workflow.name}}"
      env: *patch-env
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: batch
        template: patch-cluster
        arguments:
          parameters:
            - name: cluster
              value: "{{item}}"
        withParam: "{{steps.split.outputs.parameters.first}}"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  - name: patch-cluster
    inputs:
      parameters:
        - name: cluster
    synchronization:
      mutexes:
        - name: "tpg-cluster-{{inputs.parameters.cluster}}"
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_patch_result
          help: "Patch result per cluster (last recorded result on that cluster)"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/patch-cluster.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{workflow.parameters.timeoutSeconds}}"
      env: *patch-env
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: steps
