# ServiceAccount used by every tpg workflow (controller.workflowDefaults in the
# hub Argo Workflows values sets it as the default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-workflow
  namespace: argo
---
# The write step of tpg-rotate-credential (Round 15, D87): the same Kubernetes
# permissions as tpg-workflow (the RoleBinding below), and its own Vault role
# tpg-credential-writer, the only one that writes fleet secrets. The admission
# policy tpg-credential-writer (admission/credential-writer.yaml) keeps it to the
# WorkflowTemplate tpg-rotate-credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-credential-writer
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpg-workflow
  namespace: argo
rules:
  # Argo Workflows executor
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  # (patch: pod metadata only; the same policy refuses a change of the spec)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  # tpg-patch and tpg-create-instance read the patchFiles input from their own
  # Workflow object (Round 14): it can be larger than an environment variable
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get"]
  # Run results (tpg-run-*) are written, settings (tpg-settings) and scripts
  # (tpg-scripts) only read: the admission policy tpg-credential-writer refuses a
  # write by this Role's ServiceAccounts to any ConfigMap but tpg-run-* (Round 15)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  # kubeconfig-<cluster>, argocd-workflow-token, vault-ca. The credentials
  # themselves come from Vault (Vault Agent, role tpg-workflow).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpg-workflow
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpg-workflow
subjects:
  - kind: ServiceAccount
    name: tpg-workflow
    namespace: argo
  - kind: ServiceAccount
    name: tpg-credential-writer
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpg-workflow
  namespace: argocd
rules:
  # Refresh ApplicationSets after a Git commit (operator version changes)
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "patch"]
  # Credential rotation checks: the repository Secrets are synced from Vault by
  # the Vault Secrets Operator (VaultStaticSecrets); the workflows only read them
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["vaultstaticsecrets"]
    resourceNames: ["repo-tanzu-postgres-oci", "repo-tpg-fleet"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpg-workflow
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpg-workflow
subjects:
  - kind: ServiceAccount
    name: tpg-workflow
    namespace: argo
