{{- /*
Azure Blob backup location (pgBackRest). Field names follow the live CRD
(charts/crd-reference/source-crds). Rendered from tpg.backuplocation, then the
PostgresBackupLocation document of the instance's current postgres patch file is
merged into spec (tpg.kindPatch, Round 15, D81), then tpg.prune leaves out the
fields that hold their zero default (D69); enableSSL false is kept, because its
CRD default is true.
*/ -}}
{{- include "tpg.required" . }}
{{- $bl := include "tpg.backuplocation" (include "tpg.ctx" . | fromYaml) | fromYaml }}
{{- $_ := include "tpg.deepMerge" (dict "dst" $bl.spec "src" (include "tpg.kindPatch" (dict "root" $ "key" "PostgresBackupLocation") | fromYaml)) }}
{{- $_ := include "tpg.prune" (dict "obj" $bl "root" $) }}
{{ toYaml $bl }}
{{- define "tpg.backuplocation" }}
{{- with . }}
apiVersion: sql.tanzu.vmware.com/v1
kind: PostgresBackupLocation
metadata:
  name: {{ .Values.instance.name }}-backup-location
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # pgBackRest expiry (Round 15, D84): fullRetentionType count keeps the newest
  # fullRetention full backups, time keeps full backups for fullRetention days;
  # either way with every incremental that depends on them (incrementals have no
  # limit of their own) and the newest diffRetention differentials. WAL older than
  # the oldest kept backup is removed with it. Changing the policy restarts every
  # instance that uses this location (operator 4.5 documentation).
  {{- $rt := toString (default "count" .Values.backup.fullRetentionType) }}
  {{- if not (has $rt (list "count" "time")) }}{{ fail (printf "backup.fullRetentionType %q must be count or time" $rt) }}{{ end }}
  retentionPolicy:
    fullRetention:
      type: {{ $rt }}
      number: {{ .Values.backup.fullRetention }}
    diffRetention:
      number: {{ .Values.backup.diffRetention }}
  storage:
    azure:
      container: {{ .Values.backup.container | quote }}
      repoPath: {{ printf "/%s" .Release.Namespace | quote }}
      endpoint: {{ .Values.backup.endpoint | quote }}
      keyType: "shared"
      {{- /* Always written, true or false (backup.enableSSL, default false). */}}
      enableSSL: {{ .Values.backup.enableSSL | default false }}
      {{- /*
        forcePathStyle and additionalParameters are written only when they carry
        a value. Both are optional in the CRD and are serialized with omitempty,
        so the API server stores nothing for "forcePathStyle: false" (the
        default) and nothing for an empty "additionalParameters: {}". Argo CD
        then compares a desired object that has the keys with a live object that
        does not, and reports the Application OutOfSync forever, with a diff
        that no sync can settle. Rendering the defaults away removes the
        difference at the source; the ignoreDifferences entry in
        bootstrap/appsets/tpg-instances.yaml covers a cluster whose operator
        drops or adds them anyway.
      */}}
      {{- if .Values.backup.forcePathStyle }}
      forcePathStyle: true
      {{- end }}
      {{- /*
        caBundle: the CA certificates that sign the storage account endpoint
        (tpg-aks-infra Terraform output backup_storage_ca_bundle, written by
        the workflows from tpg-settings backupCaBundle). Written whenever
        enableSSL is true, and only then (design decision D63).
      */}}
      {{- if .Values.backup.enableSSL }}
      {{- if not .Values.backup.caBundle }}{{ fail "backup.enableSSL is true but backup.caBundle is empty: the Azure Storage CA bundle is required (tpg-settings backupCaBundle)" }}{{ end }}
      caBundle: |
        {{- .Values.backup.caBundle | trim | nindent 8 }}
      {{- end }}
      secret:
        name: backup-storage
  {{- with .Values.backup.additionalParameters }}
  additionalParameters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  backupSync:
    enabled: true
  backupIntegrityValidation:
    enabled: true
{{- end }}
{{- end }}
